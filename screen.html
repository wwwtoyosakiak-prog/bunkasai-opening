<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>発表画面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=38">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="screen">
<main id="wait" class="center wait">
  <div class="qrbox"><div id="qr"></div></div>
  <p class="url" id="url"></p>
  <p class="big"><span id="n">0</span><small>人が接続中</small></p>
  <p class="tiny" id="msg"></p>
</main>
<div id="count" class="count hidden"></div>
<div id="lit" class="center hidden titlepage">
  <h1 id="title" class="title"></h1>
  <div id="accentbar" class="accentbar"></div>
  <p id="subtitle" class="subtitle"></p>
  <div class="byline"><p id="seminar"></p><p id="presenter"></p></div>
</div>

<section id="slide" class="slide hidden">
  <div class="slidehead"><span id="prep" class="prep"></span><span id="tag" class="tag"></span></div>
  <h2 id="heading" class="heading"></h2>
  <p id="quote" class="quote"></p>
  <ol id="items" class="items"></ol>
  <dl id="facts" class="facts"></dl>
  <div id="photos" class="photos"></div>
  <figure id="split" class="splitfig hidden"><img alt=""><figcaption></figcaption></figure>
  <div id="pillars" class="pillars"></div>
  <div id="stats" class="stats"></div>
  <div id="lines" class="lines"></div>
  <figure id="figure" class="sfig hidden"><img alt=""><figcaption></figcaption></figure>
  <span id="pageNo" class="pageno"></span>
</section>

<div id="stage" class="stage hidden"><p id="missing" class="missing hidden"></p></div>

<section id="poll" class="poll hidden">
  <h2><span id="pollQ"></span><span id="closed" class="closed hidden">締め切り</span></h2>
  <p class="hint" id="pollHint"></p>
  <div class="bar yes"><span id="yesLabel"></span><div class="track"><div class="fill" id="yesFill"></div></div><span class="num" id="yesNum"></span></div>
  <div class="bar no"><span id="noLabel"></span><div class="track"><div class="fill" id="noFill"></div></div><span class="num" id="noNum"></span></div>
  <div id="compare" class="compare hidden">
    <p class="cap" id="compareCap"></p>
    <div class="bar"><span>会場のみなさん</span><div class="track"><div class="fill" id="cmpUs"></div></div><span class="num" id="cmpUsNum"></span></div>
    <div class="bar kids"><span id="kidsLabel"></span><div class="track"><div class="fill" id="cmpKids"></div></div><span class="num" id="cmpKidsNum"></span></div>
  </div>
</section>

<div class="corner" id="corner"></div>
<nav id="nav" class="snav">
  <button id="sprev" class="navbtn" aria-label="戻る">◀</button>
  <span id="snext" class="navlabel"></span>
  <button id="snextBtn" class="navbtn" aria-label="次へ">▶</button>
</nav>
<button id="unlock" class="btn unlock">🔊 クリックして音声を有効にする</button>

<script type="module">
import { db, auth, now, configured, phaseOf, setText, tally } from "./common.js?v=41";
import { VIDEOS, videoById } from "./videos.js?v=41";
import { SLIDES, renderRich } from "./slides.js?v=41";
import { nextStep, prevStep, stepName } from "./steps.js?v=41";
import { update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = id => document.getElementById(id);

// 参加者用URL（このフォルダの index.html）をQRにする
const joinURL = new URL("./", location.href).href;
new QRCode($("qr"), { text: joinURL, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
setText($("url"), joinURL.replace(/^https?:\/\//, "").replace(/\/$/, ""));

if (!configured) { setText($("msg"), "config.js が未設定です"); throw new Error("not configured"); }

// 動画は先に読み込んでおき、合図ですぐ再生できるようにする
const players = {};
for (const v of VIDEOS) {
  const el = document.createElement("video");
  el.src = v.src; el.preload = "auto"; el.playsInline = true; el.className = "hidden";
  el.addEventListener("error", () => { el.dataset.missing = "1"; });
  $("stage").appendChild(el);
  players[v.id] = el;
}

// ブラウザは操作なしに音声付き再生をさせないため、開始前に一度クリックしてもらう
let unlocked = false;
$("unlock").onclick = async () => {
  for (const el of Object.values(players)) {
    try { el.muted = true; await el.play(); el.pause(); el.currentTime = 0; } catch {}
    el.muted = false;
  }
  unlocked = true;
  $("unlock").classList.add("hidden");
  if (playing) playing.play().catch(() => {});
};

let target = 0, shown = 0, state = null;
onValue(ref(db, "presence"), s => { target = s.size; });
onValue(ref(db, "state"), s => { state = s.val(); });

// 表示中の動画の票だけを購読する
let votes = { yes: 0, no: 0, total: 0, pct: 0 }, votesFor = null, unsub = null;
function watchVotes(id) {
  if (votesFor === id) return;
  unsub?.(); votesFor = id; votes = tally(null);
  unsub = onValue(ref(db, "votes/" + id), s => { votes = tally(s.val()); });
}

let playing = null;
function playVideo(id) {
  const el = players[id];
  for (const [k, p] of Object.entries(players)) { p.classList.toggle("hidden", k !== id); if (k !== id) p.pause(); }
  const missing = el?.dataset.missing === "1";
  $("missing").classList.toggle("hidden", !missing);
  if (missing) setText($("missing"), `動画ファイルが見つかりません（${videoById(id).src}）`);
  if (!el || missing || playing === el) return;
  playing = el;
  el.currentTime = 0;
  el.play().catch(() => { $("unlock").classList.remove("hidden"); setText($("unlock"), "▶ クリックして再生"); });
}
function stopVideo() { if (playing) { playing.pause(); playing = null; } }

let lastMode = "", lastN = 0, lastVideo = null, titleKey = "";
function frame() {
  shown += (target - shown) * 0.12;
  if (Math.abs(target - shown) < 0.5) shown = target;
  const n = Math.round(shown);
  setText($("n"), String(n));

  const p = phaseOf(state);
  $("wait").classList.toggle("hidden", p.mode !== "waiting");
  $("count").classList.toggle("hidden", !(p.mode === "count" || p.mode === "ready"));
  $("lit").classList.toggle("hidden", p.mode !== "lit");
  $("stage").classList.toggle("hidden", p.mode !== "video");
  $("slide").classList.toggle("hidden", p.mode !== "slide");
  if (p.mode === "slide") showSlide(p.slide, state.color || "#ff3b6b");
  $("poll").classList.toggle("hidden", !(p.mode === "vote" || p.mode === "result"));
  setText($("corner"), p.mode === "waiting" || p.mode === "video" || p.mode === "slide" ? "" : `${n} 人が参加中`);

  if (p.mode === "ready") setText($("count"), "");
  if (p.mode === "count" && p.n !== lastN) {
    const c = $("count");
    c.textContent = p.n;
    c.classList.remove("tick"); void c.offsetWidth; c.classList.add("tick");
    lastN = p.n;
  }

  if (p.mode === "lit") {
    // 点灯の瞬間だけテーマカラーで光らせ、その後は後ろの席からも読みやすい濃い背景に切り替える
    const color = state.color || "#ff3b6b";
    document.body.style.background = p.since < 1200 ? color : "#0b0b0f";
    $("lit").style.setProperty("--tc", color);
    const key = [state.title, state.subtitle, state.presenter, state.seminar].join("\u0001");
    if (lastMode !== "lit") { revealTitle(state, p.since < 2000); titleKey = key; }
    else if (key !== titleKey) { revealTitle(state, false); titleKey = key; } // 表示中に内容を変更した場合
  } else {
    document.body.style.background = "";
  }

  if (p.mode === "video") playVideo(p.video); else stopVideo();

  if (p.mode === "vote" || p.mode === "result") {
    const v = videoById(p.video);
    watchVotes(p.video);
    setText($("pollQ"), v.question);
    $("closed").classList.toggle("hidden", p.mode !== "result");
    setText($("pollHint"), p.mode === "vote" ? `スマホで投票してください · ${votes.total}票` : `${votes.total}票`);
    setText($("yesLabel"), v.yes);
    setText($("noLabel"), v.no);
    const yp = votes.total ? votes.yes / votes.total * 100 : 0, np = votes.total ? 100 - yp : 0;
    $("yesFill").style.width = yp + "%";
    $("noFill").style.width = np + "%";
    setText($("yesNum"), `${Math.round(yp)}%`);
    setText($("noNum"), `${Math.round(np)}%`);

    const showCmp = p.mode === "result" && !!v.compare;
    $("compare").classList.toggle("hidden", !showCmp);
    if (showCmp) {
      setText($("compareCap"), `「${v.yes}」の割合を比べると…`);
      setText($("kidsLabel"), v.compare.label);
      $("cmpUs").style.width = votes.pct + "%";
      $("cmpKids").style.width = v.compare.yes + "%";
      setText($("cmpUsNum"), votes.pct + "%");
      setText($("cmpKidsNum"), v.compare.yes + "%");
    } else {
      $("cmpUs").style.width = "0"; $("cmpKids").style.width = "0";
    }
  }

  if (p.mode !== "count") lastN = 0;
  lastMode = p.mode;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 写真は先に読み込んでおく
SLIDES.flatMap(sl => [...(sl.photos || []), ...(sl.figure ? [sl.figure] : []), ...(sl.split ? [sl.split] : []), ...(sl.pillars || []).filter(p => p.icon).map(p => ({ src: p.icon }))]).forEach(it => { const i = new Image(); i.src = it.src; });

// スライド表示（ページが変わったときだけ描き直す）
let slideKey = "";
function showSlide(i, color) {
  const sl = SLIDES[i]; if (!sl) return;
  const key = i + color;
  if (key === slideKey) return;
  slideKey = key;
  $("slide").style.setProperty("--tc", color);
  setText($("prep"), sl.prep || "");
  $("prep").classList.toggle("hidden", !sl.prep);
  setText($("tag"), sl.tag);
  renderRich($("heading"), sl.heading);
  $("heading").classList.toggle("hidden", !sl.heading);
  renderRich($("quote"), sl.quote);
  $("quote").classList.toggle("hidden", !sl.quote);
  const box = $("lines"); box.textContent = "";
  (sl.lines || []).forEach(t => { const e = document.createElement("p"); renderRich(e, t); box.appendChild(e); });
  box.classList.toggle("hidden", !(sl.lines || []).length);
  const list = $("items"); list.textContent = "";
  (sl.items || []).forEach(it => {
    const li = document.createElement("li");
    const chip = document.createElement("span"); chip.className = "prep"; chip.textContent = it.prep;
    const tx = document.createElement("span"); renderRich(tx, it.text);
    li.append(chip, tx); list.appendChild(li);
  });
  list.classList.toggle("hidden", !(sl.items || []).length);
  const dl = $("facts"); dl.textContent = "";
  (sl.facts || []).forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); renderRich(dd, v);
    dl.append(dt, dd);
  });
  dl.classList.toggle("hidden", !(sl.facts || []).length);
  const ph = $("photos"); ph.textContent = "";
  (sl.photos || []).forEach(it => {
    const fig = document.createElement("figure");
    const img = document.createElement("img"); img.src = it.src; img.alt = it.cap || "";
    if (it.pos) img.style.objectPosition = it.pos;
    const cap = document.createElement("figcaption");
    if (it.step) { const n = document.createElement("span"); n.className = "step"; n.textContent = it.step; cap.appendChild(n); }
    cap.appendChild(document.createTextNode(it.cap || ""));
    fig.append(img, cap); ph.appendChild(fig);
  });
  ph.classList.toggle("hidden", !(sl.photos || []).length);
  ph.classList.toggle("flow", !!sl.flow);
  const pl = $("pillars"); pl.textContent = "";
  (sl.pillars || []).forEach(it => {
    const d = document.createElement("div"); d.className = "pillar";
    const h = document.createElement("h3"); h.textContent = it.title;
    const t = document.createElement("p"); renderRich(t, it.text);
    if (it.icon) {
      const ic = document.createElement("img"); ic.src = it.icon; ic.alt = ""; ic.className = "picon";
      const body = document.createElement("div"); body.append(h, t);
      d.classList.add("withicon"); d.append(ic, body);
    } else d.append(h, t);
    pl.appendChild(d);
  });
  pl.classList.toggle("hidden", !(sl.pillars || []).length);
  const st = $("stats"); st.textContent = "";
  (sl.stats || []).forEach(it => {
    const d = document.createElement("div"); d.className = "statcard";
    const n = document.createElement("p"); n.className = "num"; n.textContent = it.num;
    const u = document.createElement("small"); u.textContent = it.unit || ""; n.appendChild(u);
    const l = document.createElement("p"); l.className = "slabel"; renderRich(l, it.label);
    d.append(n, l); st.appendChild(d);
  });
  st.style.gridTemplateColumns = `repeat(${Math.max(1, (sl.stats || []).length)}, 1fr)`;
  st.classList.toggle("hidden", !(sl.stats || []).length);
  $("slide").classList.toggle("dense", !!((sl.items || []).length >= 3 && (sl.lines || []).length && sl.heading));
  const sp = $("split");
  sp.classList.toggle("hidden", !sl.split);
  $("slide").classList.toggle("is-split", !!sl.split);
  if (sl.split) { sp.querySelector("img").src = sl.split.src; sp.querySelector("figcaption").textContent = sl.split.cap || ""; }
  const fg = $("figure");
  fg.classList.toggle("hidden", !sl.figure);
  $("slide").classList.toggle("hasfig", !!sl.figure);
  if (sl.figure) { const im = fg.querySelector("img"); im.src = sl.figure.src; im.classList.toggle("contain", sl.figure.fit === "contain"); im.style.objectPosition = sl.figure.pos || ""; fg.querySelector("figcaption").textContent = sl.figure.cap || ""; }
  setText($("pageNo"), String(i + 2));
  const sec = $("slide"); sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter");
}

// タイトルを1文字ずつ浮かび上がらせる（タイトル画面に戻ったときはすぐ表示）
function revealTitle(st, animate) {
  const text = st.title || "";
  const el = $("title");
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch === " " ? " " : ch;
    s.style.animationDelay = animate ? (400 + i * 70) + "ms" : "0ms";
    if (!animate) s.style.animationDuration = "1ms";
    el.appendChild(s);
  });
  // 副題・ゼミ名・発表者はタイトルのあとにふわっと出す
  const after = animate ? 400 + text.length * 70 + 300 : 0;
  [["accentbar", 0], ["subtitle", 0], ["seminar", 250], ["presenter", 400]].forEach(([id, d]) => {
    const e = $(id);
    if (id !== "accentbar") e.textContent = st[id] || "";
    e.classList.remove("fadein"); void e.offsetWidth; e.classList.add("fadein");
    e.style.animationDelay = (after + (animate ? d : 0)) + "ms";
    e.style.animationDuration = animate ? "" : "1ms";
  });
}

// ===== 発表画面からの操作（次へ・戻る） =====
// 書き込みはデータベースのルールで発表者のGoogleアカウントだけに制限されている
let presenter = null;
onAuthStateChanged(auth, u => { presenter = u && !u.isAnonymous ? u : null; });
async function ensureLogin() {
  if (presenter) return true;
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); return true; }
  catch (e) { if (e.code === "auth/popup-blocked") signInWithRedirect(auth, provider); flash("ログインできませんでした"); return false; }
}
async function go(st) {
  if (!st) return;
  if (!unlocked) $("unlock").click(); // ボタン操作をきっかけに動画の音声も有効にする
  if (!(await ensureLogin())) return;
  const data = st.phase === "go" ? { phase: "go", startAt: Math.round(now() + 1500) } : st.phase === "title" ? { phase: "title" } : st;
  update(ref(db, "state"), data).catch(() => flash("このアカウントには操作権限がありません"));
}
$("snextBtn").onclick = () => go(nextStep(state));
$("sprev").onclick = () => go(prevStep(state));
// キーボード・プレゼン用リモコン：→ / Space / PageDown / Enter で次へ、← / PageUp で戻る
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(nextStep(state)); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(prevStep(state)); }
});
// ボタンはマウスを動かしたときだけ表示し、しばらくすると隠れる（聴衆の邪魔にならないように）
let hideTimer = 0;
function showNav() { $("nav").classList.add("show"); clearTimeout(hideTimer); hideTimer = setTimeout(() => $("nav").classList.remove("show"), 2500); }
addEventListener("mousemove", showNav);
addEventListener("touchstart", showNav, { passive: true });
let flashUntil = 0;
setInterval(() => { if (Date.now() > flashUntil) setText($("snext"), "次：" + stepName(nextStep(state))); }, 300);
function flash(msg) { flashUntil = Date.now() + 3000; setText($("snext"), msg); showNav(); }
</script>
</body>
</html>
