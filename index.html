<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>参加ページ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=47">
</head>
<body class="participant">
<main id="wait" class="center">
  <div class="pulse"></div>
  <p class="label">CONNECTED</p>
  <h1>接続しました</h1>
  <p class="sub">画面を開いたまま<br>合図を待ってください</p>
  <button id="ready" class="btn">準備OK</button>
  <p id="status" class="tiny"></p>
</main>
<div id="count" class="count hidden"></div>
<div id="lit" class="lit hidden"><p id="litTitle"></p></div>

<main id="video" class="center hidden">
  <p class="label">NOW SHOWING</p>
  <h1 id="videoName"></h1>
  <p class="sub">スクリーンの動画を見てください<br>このあと投票があります</p>
</main>

<main id="vote" class="center hidden">
  <p class="label">VOTE</p>
  <h1 id="voteQ"></h1>
  <div class="votebtns">
    <button id="yesBtn" class="vbtn yes"></button>
    <button id="noBtn" class="vbtn no"></button>
  </div>
  <p id="voteMsg" class="sub"></p>
</main>

<main id="slideView" class="center hidden">
  <p class="label" id="slideTag"></p>
  <h1 id="slideHeading" class="slideh"></h1>
</main>

<main id="result" class="center hidden">
  <p class="label">RESULT</p>
  <h1>投票ありがとうございました</h1>
  <p class="sub">結果はスクリーンで発表中です</p>
  <p id="myVote" class="tiny"></p>
</main>

<script type="module">
import { db, auth, configured, phaseOf, setText } from "./common.js?v=71";
import { videoById } from "./videos.js?v=71";
import { SLIDES, renderRich } from "./slides.js?v=71";
import { ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const $ = id => document.getElementById(id);
if (!configured) { setText($("status"), "config.js が未設定です"); throw new Error("not configured"); }

// 画面が暗くならないようにする（対応ブラウザのみ）
let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
$("ready").onclick = async () => {
  await keepAwake();
  $("ready").textContent = "準備完了 ✓";
  $("ready").disabled = true;
};
document.addEventListener("visibilitychange", () => {
  if (wakeLock && document.visibilityState === "visible") keepAwake();
});

// 接続人数のカウント用：自分の存在を登録し、切断時に自動で消す
// すでにログイン中（発表者が同じブラウザで操作パネルを使っている等）ならその状態のまま参加する
let registered = false;
onAuthStateChanged(auth, user => {
  if (!user) {
    signInAnonymously(auth).catch(() => setText($("status"), "接続できませんでした。再読み込みしてください"));
    return;
  }
  if (registered) return;
  registered = true;
  const me = ref(db, "presence/" + user.uid);
  onValue(ref(db, ".info/connected"), s => {
    if (s.val() !== true) { setText($("status"), "再接続中…"); return; }
    setText($("status"), "");
    onDisconnect(me).remove().then(() => set(me, true));
  });
});

// 発表者の操作を受け取る（参加者側からは書き込めない）
let state = null;
onValue(ref(db, "state"), s => { state = s.val(); });

// 投票：自分の票だけ書き込める（受付中の動画に対してのみ、ルールで制限）
const myVotes = {};
let currentVideo = null;
async function cast(choice) {
  const user = auth.currentUser;
  if (!user || !currentVideo) return;
  myVotes[currentVideo] = choice;
  paintVote();
  try { await set(ref(db, `votes/${currentVideo}/${user.uid}`), choice); }
  catch { setText($("voteMsg"), "受付が終了しました"); }
}
$("yesBtn").onclick = () => cast("yes");
$("noBtn").onclick = () => cast("no");
function paintVote() {
  const mine = myVotes[currentVideo];
  $("yesBtn").classList.toggle("sel", mine === "yes");
  $("noBtn").classList.toggle("sel", mine === "no");
  setText($("voteMsg"), mine ? "投票しました（締め切りまで変更できます）" : "どちらかをタップしてください");
}

let lastMode = "", lastN = 0, lastSlide = -1;
function frame() {
  const p = phaseOf(state);
  for (const id of ["video", "vote", "result"]) $(id).classList.toggle("hidden", p.mode !== id);
  $("wait").classList.toggle("hidden", p.mode !== "waiting");
  $("slideView").classList.toggle("hidden", p.mode !== "slide");
  if (p.mode === "slide" && SLIDES[p.slide] && lastSlide !== p.slide) {
    lastSlide = p.slide;
    const sl = SLIDES[p.slide];
    setText($("slideTag"), sl.prep ? `${sl.prep}｜${sl.tag}` : sl.tag);
    renderRich($("slideHeading"), sl.heading || (sl.items || []).map(it => `${it.prep}　${it.text}`).join("\n") || (sl.facts || []).map(([k, v]) => `${k}：${v}`).join("\n") || (sl.stats || []).map(it => `${it.num}${it.unit}　${it.label.replace(/\n/g, "")}`).join("\n") || (sl.photos || []).map(it => `${it.step || ""}${it.cap}`).join("\n") || "スクリーンをご覧ください");
    $("slideView").style.setProperty("--tc", state.color || "#ff3b6b");
  }
  if (p.mode !== "slide") lastSlide = -1;
  $("count").classList.toggle("hidden", !(p.mode === "count" || p.mode === "ready"));
  $("lit").classList.toggle("hidden", p.mode !== "lit");

  const v = p.video ? videoById(p.video) : null;
  if (v) {
    if (currentVideo !== v.id) { currentVideo = v.id; paintVote(); }
    setText($("videoName"), v.name.replace(/^.*?：/, ""));
    setText($("voteQ"), v.question);
    setText($("yesBtn"), "👍 " + v.yes);
    setText($("noBtn"), "👎 " + v.no);
    const mine = myVotes[v.id];
    setText($("myVote"), mine ? `あなたの投票：${mine === "yes" ? v.yes : v.no}` : "");
    if (p.mode === "vote" && lastMode !== "vote") navigator.vibrate?.(120);
  }

  if (p.mode === "count" && p.n !== lastN) {
    const c = $("count");
    c.textContent = p.n;
    c.classList.remove("tick"); void c.offsetWidth; c.classList.add("tick");
    navigator.vibrate?.(40);
    lastN = p.n;
  }
  if (p.mode === "ready") setText($("count"), "");
  if (p.mode === "lit") {
    const color = state.color || "#ff3b6b";
    $("lit").style.background = color;
    document.body.style.background = color;
    setText($("litTitle"), state.title || "");
    if (lastMode !== "lit") navigator.vibrate?.(300);
  } else {
    document.body.style.background = "";
  }
  if (p.mode !== "count") lastN = 0;
  lastMode = p.mode;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
