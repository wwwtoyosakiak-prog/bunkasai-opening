<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>操作パネル</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body class="control">
<div class="wrap">
  <p class="label">CONTROL</p>

  <section id="login" class="card">
    <p>発表者のGoogleアカウントでログインしてください。</p>
    <button id="signin" class="btn primary">Googleでログイン</button>
  </section>

  <section id="panel" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="row"><span class="sub">接続人数</span><span id="state" class="pill">待機中</span></div>
      <div class="stat"><span id="n">0</span> 人</div>
    </div>

    <div class="card">
      <label class="sub" for="titleIn">発表タイトル</label>
      <input id="titleIn" type="text" placeholder="例：動画で子どもを呼び込む">
      <label class="sub" for="subtitleIn">副題</label>
      <input id="subtitleIn" type="text" placeholder="例：多摩祭2026 段ボールガチャワークショップの報告">
      <label class="sub" for="presenterIn">発表者</label>
      <input id="presenterIn" type="text" placeholder="例：青木公亮・〇〇〇〇">
      <label class="sub" for="seminarIn">ゼミ名</label>
      <input id="seminarIn" type="text" placeholder="例：多摩大学 経営情報学部 新西ゼミ">
      <span class="sub">光らせる色</span>
      <div class="swatches" id="sw"></div>
      <button id="save" class="btn">タイトル画面の内容と色を反映</button>
    </div>

    <button id="go" class="btn primary go">3・2・1 スタート</button>
    <p id="err" class="err"></p>

    <p class="label" style="margin-top:8px">スライド</p>
    <div class="card">
      <div class="row"><b id="slideNow">-</b><span id="slidePill" class="pill">-</span></div>
      <div class="steps" style="grid-template-columns:1fr 1fr">
        <button id="prev" class="btn">◀ 前へ</button>
        <button id="next" class="btn primary">次へ ▶</button>
      </div>
      <div id="slideList" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <p class="label" style="margin-top:8px">動画と投票</p>
    <div id="videos" style="display:flex;flex-direction:column;gap:14px"></div>

    <button id="titleBtn" class="btn">タイトル画面に戻す</button>
    <button id="reset" class="btn danger">待機画面に戻す</button>
    <button id="clearVotes" class="btn danger">投票をすべてリセット</button>

    <div class="row"><span id="who" class="tiny"></span><button id="out" class="btn danger" style="min-width:0;padding:8px 14px;font-size:13px">ログアウト</button></div>
  </section>
  <p id="msg" class="tiny"></p>
</div>

<script type="module">
import { db, auth, configured, now, phaseOf, setText, tally } from "./common.js?v=12";
import { VIDEOS } from "./videos.js?v=12";
import { SLIDES } from "./slides.js?v=12";
import { ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const $ = id => document.getElementById(id);
if (!configured) { setText($("msg"), "config.js が未設定です"); throw new Error("not configured"); }

const COLORS = ["#ff3b6b", "#ff8a00", "#ffd60a", "#30d158", "#0a84ff", "#bf5af2", "#ffffff"];
let color = COLORS[0], state = null;
const FIELDS = [["title", "titleIn"], ["subtitle", "subtitleIn"], ["presenter", "presenterIn"], ["seminar", "seminarIn"]];

COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "sw"; b.style.background = c; b.ariaLabel = c;
  b.onclick = () => { color = c; paintSwatches(); };
  $("sw").appendChild(b);
});
function paintSwatches() {
  [...$("sw").children].forEach((b, i) => b.classList.toggle("sel", COLORS[i] === color));
}
paintSwatches();

$("signin").onclick = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch (e) { if (e.code === "auth/popup-blocked") signInWithRedirect(auth, provider); else setText($("msg"), "ログインに失敗しました：" + e.code); }
};
$("out").onclick = () => signOut(auth);

let subscribed = false;
onAuthStateChanged(auth, u => {
  // 参加ページを同じブラウザで開いた場合の匿名ログインは発表者として扱わない
  const user = u && !u.isAnonymous ? u : null;
  $("login").classList.toggle("hidden", !!user);
  $("panel").classList.toggle("hidden", !user);
  setText($("who"), user ? user.email : "");
  if (user && !subscribed) {
    subscribed = true;
    onValue(ref(db, "presence"), s => setText($("n"), String(s.size)));
    for (const v of VIDEOS) onValue(ref(db, "votes/" + v.id), s => {
      const t = tally(s.val());
      setText(cards[v.id].tally, `👍 ${v.yes} ${t.yes}　👎 ${v.no} ${t.no}　（${t.pct}%）`);
    });
    onValue(ref(db, "state"), s => {
      state = s.val();
      for (const [k, id] of FIELDS) if (state?.[k] != null && document.activeElement !== $(id)) $(id).value = state[k];
      if (state?.color) { color = state.color; paintSwatches(); }
    });
  }
});

// 書き込みはデータベースのルールで発表者アカウントだけに制限されている
function write(data) {
  setText($("err"), "");
  return update(ref(db, "state"), data).catch(e => {
    setText($("err"), e.code === "PERMISSION_DENIED" || /permission/i.test(e.message)
      ? "このアカウントには操作権限がありません"
      : "反映できませんでした：" + e.message);
  });
}
const fields = () => Object.fromEntries(FIELDS.map(([k, id]) => [k, $(id).value.trim()]));
$("save").onclick = () => write({ ...fields(), color });
$("go").onclick = () => write({ ...fields(), color, phase: "go", startAt: Math.round(now() + 1500) });
$("reset").onclick = () => { if (confirm("待機画面に戻しますか？")) write({ phase: "waiting" }); };
$("titleBtn").onclick = () => write({ phase: "title" });
$("clearVotes").onclick = () => {
  if (!confirm("すべての投票を消しますか？（リハーサル後に使います）")) return;
  remove(ref(db, "votes")).catch(e => setText($("err"), "リセットできませんでした：" + e.message));
};

// 動画ごとの操作カード：上映 → 投票開始 → 締め切り（結果表示）
const cards = {};
for (const v of VIDEOS) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="row"><b></b><span class="pill">-</span></div>
    <span class="tiny"></span>
    <div class="steps">
      <button class="btn" data-p="video">▶ 上映</button>
      <button class="btn" data-p="vote">投票開始</button>
      <button class="btn" data-p="result">締め切り</button>
    </div>`;
  card.querySelector("b").textContent = v.name;
  card.querySelectorAll("button").forEach(b => b.onclick = () => write({ phase: b.dataset.p, video: v.id }));
  $("videos").appendChild(card);
  cards[v.id] = { el: card, pill: card.querySelector(".pill"), tally: card.querySelector(".tiny"), btns: card.querySelectorAll("button") };
  setText(cards[v.id].tally, "まだ投票はありません");
}

// スライド操作：タイトル画面 → 2ページ目 → … の順に進む
const goSlide = i => i < 0 ? write({ phase: "title" }) : write({ phase: "slide", slide: Math.min(i, SLIDES.length - 1) });
const curSlide = () => { const p = phaseOf(state); return p.mode === "slide" ? p.slide : -1; };
$("next").onclick = () => goSlide(curSlide() + 1);
$("prev").onclick = () => goSlide(curSlide() - 1);
const slideBtns = SLIDES.map((sl, i) => {
  const b = document.createElement("button");
  b.className = "btn"; b.style.cssText = "min-width:0;padding:10px 14px;font-size:14px;text-align:left";
  b.textContent = `${i + 2}. ${sl.prep ? sl.prep + "｜" : ""}${sl.tag}`;
  b.onclick = () => goSlide(i);
  $("slideList").appendChild(b);
  return b;
});

const labels = { slide: "スライド表示中", waiting: "待機中", ready: "まもなく", count: "カウント中", lit: "タイトル表示中", video: "上映中", vote: "投票受付中", result: "結果表示中" };
const steps = { video: "上映中", vote: "投票受付中", result: "結果表示中" };
(function tick() {
  const p = phaseOf(state);
  setText($("state"), labels[p.mode]);
  $("state").classList.toggle("on", p.mode !== "waiting");
  const cs = p.mode === "slide" ? p.slide : -1;
  setText($("slideNow"), cs >= 0 ? `${cs + 2}ページ目：${SLIDES[cs].prep ? SLIDES[cs].prep + "｜" : ""}${SLIDES[cs].tag}` : (p.mode === "lit" ? "1ページ目：タイトル" : "-"));
  setText($("slidePill"), `${cs >= 0 ? cs + 2 : (p.mode === "lit" ? 1 : "-")} / ${SLIDES.length + 1}`);
  slideBtns.forEach((b, i) => b.classList.toggle("primary", i === cs));
  for (const [id, c] of Object.entries(cards)) {
    const active = p.video === id;
    setText(c.pill, active ? steps[p.mode] : "-");
    c.pill.classList.toggle("on", active);
    c.btns.forEach(b => b.classList.toggle("primary", active && b.dataset.p === p.mode));
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
